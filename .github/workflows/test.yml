name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: pip install .[test]

      - name: Run tests
        run: pytest -v

      - name: Validate packaging (sdist + wheel build)
        run: |
          pip install build
          python -m build

  test-topo-encodings:
    # The second distribution in topo-encodings/ (standard library only; pyproj is
    # the optional crs extra, so the tests run without it and then with it).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: topo-encodings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the distribution with test extras
        run: pip install ".[test]"

      - name: Check it declares no runtime dependencies
        run: >-
          python -c "import importlib.metadata as m;
          r = [x for x in m.requires('topo-encodings') or [] if 'extra ==' not in x];
          assert not r, r"

      - name: Run tests without the crs extra
        run: pytest -v

      - name: Install the crs extra (pyproj)
        run: pip install ".[test,crs]"

      - name: Run tests with the crs extra
        run: pytest -v

      - name: Validate packaging (sdist + wheel build)
        run: |
          pip install build
          python -m build
