[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-rdf-geojson"
version = "0.9.0"
description = "Convert RDF (Turtle/JSON-LD) topology models (geojson-topo vocabulary) to GeoJSON geometry objects, convert topo-feature JSON to GeoJSON, and validate Topo Feature / 3D CSDM topology consistency"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rdflib>=6.0",
    "pyproj>=3.5",
    "splines>=0.3",
    "numpy>=1.21",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
geojson = [
    "pyproj>=3.5",
]
test = [
    "pyproj>=3.5",
    "splines>=0.3",
    "numpy>=1.21",
    "pytest>=7.0",
]

[project.scripts]
topo-rdf-geojson = "topo_rdf_geojson:_cli"
topo2geojson = "topo2geojson:_cli"
topo-validate = "topo_validator.cli:main"

[tool.setuptools]
py-modules = [
    "topo_rdf_geojson",
    "topo_rdf_common",
    "topo2geojson",
]
packages = [
    "geometry",
    "topo_validator",
    "topo_validator.conformance",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
