[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-rdf-geojson"
version = "0.4.0"
description = "Convert RDF Turtle topology models (geojson-topo vocabulary) to GeoJSON geometry objects, and convert topo-feature JSON to GeoJSON"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rdflib>=6.0",
    "pyproj>=3.5",
    "splines>=0.3",
    "numpy>=1.21",
]

[project.optional-dependencies]
geojson = [
    "pyproj>=3.5",
]
test = [
    "pyproj>=3.5",
    "splines>=0.3",
    "numpy>=1.21",
    "pytest>=7.0",
]

[project.scripts]
topo-rdf-geojson = "topo_rdf_geojson:_cli"
topo2geojson = "topo2geojson:_cli"

[tool.setuptools]
py-modules = [
    "topo_rdf_geojson",
    "topo2geojson",
    "arc_densify",
    "arc_geometry",
    "arc_to_geojson_writer",
    "spline_geometry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
